name: Inotia1 240x320 smooth direction WFS APK

on:
  push:
    branches:
      - perf/inotia-240x320-smooth-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inotia1-240x320-smooth-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_REF: eb891499fb89a592e55efb2cf0b97d0c3e89bb7f
  FRONTEND_REF: 3291fea9de5fe79e085de97d031690899e2f7e06
  AUTHD_REF: 4053607356dd89e621740388f7ec761e27ecee58
  WORKING_BASE: 71bbd37fd1e45d2d5e81c68ec99c79a0cb2f964c

jobs:
  android:
    name: 240x320 + direction v2 + WFS + low-latency pacing
    runs-on: ubuntu-latest
    steps:
      - name: Check out product
        uses: actions/checkout@v6
        with:
          path: aram-emu
          persist-credentials: false

      - name: Check out exact working core
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-core
          ref: ${{ env.CORE_REF }}
          path: aram-core
          persist-credentials: false

      - name: Check out exact working frontend
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-frontend
          ref: ${{ env.FRONTEND_REF }}
          path: aram-frontend
          persist-credentials: false

      - name: Check out exact working authd
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-authd
          ref: ${{ env.AUTHD_REF }}
          path: aram-authd
          persist-credentials: false

      - name: Apply Inotia1 direction base and WFS compatibility first
        working-directory: aram-emu
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/scripts/apply_inotia1_direction_fix.py
          python3 .github/scripts/apply_wfs_backup_extension.py
          gofmt -w \
            ../aram-core/application/internal/ktf/ktf_scheduler.go \
            ../aram-core/application/internal/ktf/ktf_clet_input_test.go \
            ../aram-frontend/frontend/shell_savedata.go \
            ../aram-frontend/frontend/picker.go
          grep -n 'inotiaDirectionUsesCardInput' ../aram-core/application/internal/ktf/ktf_scheduler.go
          grep -n 'TestKTFInotia1DirectionsUseRegularHeldEdges' ../aram-core/application/internal/ktf/ktf_clet_input_test.go
          grep -n 'TestKTFInotia1DirectionsBypassGrabbedKeyPath' ../aram-core/application/internal/ktf/ktf_clet_input_test.go
          grep -n 'WFSAVEBK' ../aram-frontend/frontend/shell_savedata.go
          sha256sum \
            ../aram-core/application/internal/ktf/ktf_scheduler.go \
            ../aram-core/application/internal/ktf/ktf_clet_input_test.go \
            ../aram-frontend/frontend/shell_savedata.go \
            ../aram-frontend/frontend/picker.go > /tmp/inotia-base-before.sha256

      - name: Apply proven WIPI 240x320 geometry
        working-directory: aram-emu
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/apply_inotia_resolution_choices.py ../aram-core ../aram-frontend
          gofmt -w \
            ../aram-core/application/internal/ktf/ktf_title_quirks.go \
            ../aram-frontend/frontend/shell_settings_display.go
          grep -n 'descriptor.AID == "010100D3"' ../aram-core/application/internal/ktf/ktf_title_quirks.go
          grep -n 'return 240, 320' ../aram-core/application/internal/ktf/ktf_title_quirks.go

      - name: Apply low-latency single-quantum frame pacing
        working-directory: aram-emu
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/apply_inotia_smooth_pacing.py ../aram-frontend
          gofmt -w ../aram-frontend/frontend/pacing.go
          grep -n 'framePacingQuantaPerTick = 1' ../aram-frontend/frontend/pacing.go
          grep -n 'uiPriority: false' ../aram-frontend/frontend/pacing.go

      - name: Prove direction and WFS files remain byte-identical
        working-directory: aram-emu
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum \
            ../aram-core/application/internal/ktf/ktf_scheduler.go \
            ../aram-core/application/internal/ktf/ktf_clet_input_test.go \
            ../aram-frontend/frontend/shell_savedata.go \
            ../aram-frontend/frontend/picker.go > /tmp/inotia-base-after.sha256
          diff -u /tmp/inotia-base-before.sha256 /tmp/inotia-base-after.sha256
          git -C ../aram-core diff --check
          git -C ../aram-frontend diff --check

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
          cache-dependency-path: |
            aram-emu/go.sum
            aram-emu/go.work.sum
            aram-core/go.sum
            aram-frontend/go.sum
            aram-authd/go.sum

      - name: Test direction press release regression
        working-directory: aram-core
        shell: bash
        run: |
          go test ./application/internal/ktf \
            -run 'TestKTF(CletCardUsesNativeInputEdgeValues|Inotia1DirectionsUseRegularHeldEdges|Inotia1DirectionsBypassGrabbedKeyPath)$' \
            -count=1

      - name: Test full KTF package
        working-directory: aram-core
        shell: bash
        run: go test ./application/internal/ktf -count=1

      - name: Test WFS backup and restore compatibility
        working-directory: aram-emu
        shell: bash
        run: go test ./integration -run 'WFS|LegacyWFS' -count=1

      - name: Test frontend pacing and compile
        working-directory: aram-frontend
        shell: bash
        run: go test ./frontend -count=1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"
          cache-provider: basic

      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "${sdkmanager}"
          "${sdkmanager}" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "${GITHUB_ENV}"

      - name: Build integrated Android AAR
        working-directory: aram-emu
        shell: bash
        run: |
          set -euxo pipefail
          ebiten_version="$(go list -m -f '{{.Version}}' github.com/hajimehoshi/ebiten/v2)"
          go install "github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@${ebiten_version}"
          mkdir -p android/app/libs android/app/src/main/assets dist
          build_version="Inotia1WIPI240Smooth-${GITHUB_SHA::7}"
          ebitenmobile bind \
            -target android/arm64,android/amd64 \
            -androidapi 23 \
            -trimpath \
            -ldflags="-s -w -X=github.com/mirusu400/aram-frontend/frontend.BuildVersion=${build_version}" \
            -javapkg io.github.mirusu400.aram \
            -o android/app/libs/aram.aar \
            ./mobile
          {
            echo "aram-emu=${GITHUB_SHA}"
            echo "working-base=${WORKING_BASE}"
            echo "aram-core=${CORE_REF} + inotia-wipi-geometry + direction-v2"
            echo "aram-frontend=${FRONTEND_REF} + inotia-single-quantum-pacing"
            echo "inotia1-direction-fix=wipi-card-route-held-edges-v2"
            echo "direction-grab-route=inotia-directions-force-card"
            echo "save-backup=wfs-when-lossless"
            echo "save-restore=wfs-compatible"
            echo "wipi-host-geometry=240x320"
            echo "frame-pacing=max-one-quantum-per-tick"
            echo "frame-backlog=drop-not-batch"
            echo "ui-priority-sleep=disabled"
            echo "graphics-core=stock"
          } > android/app/src/main/assets/BUILD-INFO.txt

      - name: Build APK
        working-directory: aram-emu
        shell: bash
        env:
          ARAM_VERSION_CODE: ${{ github.run_number }}
          ARAM_VERSION_NAME: inotia1-240x320-smooth-${{ github.run_number }}
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace -p android :app:assembleGithubDebug
          apk="android/app/build/outputs/apk/github/debug/app-github-debug.apk"
          test -s "${apk}"
          cp "${apk}" dist/aram-inotia1-240x320-smooth-v1.apk
          info="$(unzip -p dist/aram-inotia1-240x320-smooth-v1.apk assets/BUILD-INFO.txt)"
          printf '%s\n' "${info}"
          printf '%s\n' "${info}" | grep -Fx "inotia1-direction-fix=wipi-card-route-held-edges-v2"
          printf '%s\n' "${info}" | grep -Fx "direction-grab-route=inotia-directions-force-card"
          printf '%s\n' "${info}" | grep -Fx "save-backup=wfs-when-lossless"
          printf '%s\n' "${info}" | grep -Fx "save-restore=wfs-compatible"
          printf '%s\n' "${info}" | grep -Fx "wipi-host-geometry=240x320"
          printf '%s\n' "${info}" | grep -Fx "frame-pacing=max-one-quantum-per-tick"
          sha256sum dist/aram-inotia1-240x320-smooth-v1.apk > dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: aram-inotia1-240x320-smooth-v1
          path: |
            aram-emu/dist/aram-inotia1-240x320-smooth-v1.apk
            aram-emu/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
